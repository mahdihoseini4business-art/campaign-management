<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0155d2">
  <title>CARNO — نسخه آفلاین</title>
  <link rel="icon" type="image/webp" href="/icon.webp">
  <link rel="stylesheet" href="/fonts/vazirmatn.css">
  <link rel="stylesheet" href="/src/shell.css">
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <div class="offline-shell">
    <header class="offline-header">
      <img src="/icon.webp" alt="" width="40" height="40" class="offline-logo">
      <div>
        <h1>CARNO — نسخه آفلاین</h1>
        <p class="offline-subtitle">ذخیره‌سازی محلی SQLite — بدون نیاز به اینترنت</p>
      </div>
      <div id="userBar" class="offline-user-bar"></div>
      <span class="offline-badge">آفلاین</span>
    </header>

    <main class="offline-main">
      <section class="offline-card" id="statusCard">
        <h2>وضعیت سیستم</h2>
        <dl class="offline-dl" id="statusList">
          <div><dt>در حال بارگذاری…</dt><dd></dd></div>
        </dl>
      </section>

      <section class="offline-card">
        <h2>جداول پایگاه داده</h2>
        <div class="offline-table-grid" id="tableCounts"></div>
      </section>

      <section class="offline-card offline-card-muted">
        <h2>بکاپ و داده</h2>
        <p class="offline-hint">برای به‌روزرسانی داده‌ها، بکاپ جدید از نسخه آنلاین را ایمپورت کنید (جایگزینی کامل).</p>
        <div class="offline-actions">
          <button type="button" class="btn btn-primary" id="importBackupBtn" disabled>ایمپورت بکاپ جدید…</button>
          <button type="button" class="btn" id="refreshBtn">بروزرسانی</button>
        </div>
        <p id="backupPreview" class="offline-preview" hidden></p>
      </section>
    </main>

    <footer class="offline-footer">
      <span id="backupModuleInfo"></span>
    </footer>
  </div>
</body>
</html>
