<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<meta name="robots" content="noindex, nofollow">
<title>Platform Admin — CARNO</title>
<link rel="icon" type="image/webp" href="/icon.webp">
<link rel="stylesheet" href="/fonts/vazirmatn.css">
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --danger: #f87171;
    --ok: #4ade80;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Vazirmatn', 'Segoe UI', Tahoma, system-ui, sans-serif;
    min-height: 100vh;
    background: radial-gradient(1200px 600px at 10% -10%, #1e3a5f 0%, var(--bg) 55%);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 32px 20px 48px; }
  h1 { font-size: 1.35rem; font-weight: 700; margin-bottom: 6px; }
  h2 { font-size: 1.05rem; margin-bottom: 12px; }
  .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 24px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
  }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
  input, select {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #0b1220;
    color: var(--text);
    font: inherit;
    margin-bottom: 14px;
  }
  input:focus, select:focus {
    outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
    border-color: var(--accent);
  }
  button, .btn {
    font: inherit;
    border: 0;
    border-radius: 10px;
    padding: 12px 18px;
    background: var(--accent);
    color: #0f172a;
    font-weight: 700;
    cursor: pointer;
  }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  .status {
    margin-top: 14px;
    font-size: 0.88rem;
    line-height: 1.6;
    padding: 10px 12px;
    border-radius: 10px;
    background: #0b1220;
    border: 1px solid var(--border);
  }
  .status[data-tone="error"] { color: var(--danger); }
  .status[data-tone="info"] { color: var(--muted); }
  .badge {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 4px 8px;
    border-radius: 999px;
    background: #0b1220;
    border: 1px solid var(--border);
    color: var(--accent);
    margin-bottom: 12px;
  }
  ul { margin: 12px 0 0; padding-right: 18px; color: var(--muted); font-size: 0.9rem; line-height: 1.8; }
  ul strong { color: var(--text); font-weight: 600; }
  .grid { display: grid; gap: 16px; grid-template-columns: 1fr; }
  @media (min-width: 860px) { .grid-2 { grid-template-columns: 1fr 1fr; } }
  .shell-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
  .stack { display: grid; gap: 16px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .toolbar input, .toolbar select { margin-bottom: 0; flex: 1; min-width: 140px; }
  .toolbar button { white-space: nowrap; }
  .inline-actions { display: inline-flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
  .inline-actions button { padding: 4px 8px; font-size: 0.75rem; }
  .boot-card { text-align: center; color: var(--muted); }
  .gate-wrap { max-width: 420px; margin: 0 auto; }
  a.sub-link { color: var(--accent); text-decoration: none; }
  a.sub-link:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="wrap">
    <div id="platformBoot" class="card boot-card">
      در حال بررسی نشست…
    </div>

    <!-- Public surface: login only. Admin UI is mounted after server whoami. -->
    <div id="platformGate" class="gate-wrap" hidden>
      <span class="badge">PLATFORM</span>
      <h1>ورود سوپرادمین</h1>
      <p class="sub">فقط شماره‌های مجاز سرور می‌توانند وارد شوند.</p>
      <section class="card">
        <form id="platformSendOtpForm">
          <label for="platformPhone">موبایل</label>
          <input id="platformPhone" name="phone" type="tel" inputmode="tel" placeholder="09xxxxxxxxx" autocomplete="tel" required>
          <button type="submit" id="platformSendOtpBtn">ارسال کد</button>
        </form>
        <form id="platformLoginForm" style="margin-top:16px;">
          <div id="platformOtpBlock" hidden>
            <label for="platformOtp">کد تأیید</label>
            <input id="platformOtp" name="otp" type="text" inputmode="numeric" placeholder="------" autocomplete="one-time-code" required>
            <button type="submit" id="platformLoginBtn">ورود</button>
          </div>
        </form>
        <div id="platformGateStatus" class="status" hidden></div>
      </section>
    </div>

    <!-- Empty host: shell DOM is injected only after authenticated whoami -->
    <div id="platformShellHost"></div>
  </div>
  <script type="module" src="/src/platform/main.js"></script>
</body>
</html>
