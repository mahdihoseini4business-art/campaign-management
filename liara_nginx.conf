# Custom routes for static deploy (Liara).
# /platform must not fall through to the tenant app index.

location = /platform {
  try_files /platform.html =404;
}

location = /platform/ {
  try_files /platform.html =404;
}

location = /signup {
  try_files /signup.html =404;
}

location = /signup/ {
  try_files /signup.html =404;
}

location / {
  try_files $uri $uri/ /index.html;
}
