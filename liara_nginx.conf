# Custom routes for static deploy (Liara).
# /platform must not fall through to the tenant app index.

# Built JS/CSS must 404 when missing — never SPA-fallback to HTML
# (that causes "Expected a JavaScript module but got text/html").
location ^~ /assets/ {
  try_files $uri =404;
  add_header Cache-Control "public, max-age=31536000, immutable";
}

location = /login {
  try_files /login.html =404;
}

location = /login/ {
  try_files /login.html =404;
}

location = /platform {
  try_files /platform.html =404;
}

location = /platform/ {
  try_files /platform.html =404;
}

location = /signup {
  try_files /signup.html =404;
}

location = /signup/ {
  try_files /signup.html =404;
}

location = /payment-result {
  try_files /payment-result.html =404;
}

location = /payment-result/ {
  try_files /payment-result.html =404;
}

location / {
  try_files $uri $uri/ /index.html;
}
