<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نتیجه پرداخت — CARNO</title>
<link rel="icon" type="image/webp" href="/icon.webp">
<link rel="stylesheet" href="/fonts/vazirmatn.css">
<style>
  body {
    font-family: Vazirmatn, Tahoma, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
    background: linear-gradient(135deg, #e6effa, #f8fafc);
    padding: 24px;
  }
  .card {
    background: #fff;
    border-radius: 20px;
    padding: 32px;
    max-width: 440px;
    width: 100%;
    box-shadow: 0 12px 40px rgba(1,85,210,.12);
    text-align: center;
  }
  h1 { font-size: 1.25rem; margin: 0 0 10px; }
  p { color: #64748b; line-height: 1.7; margin: 0 0 12px; }
  .meta { font-size: 0.85rem; color: #94a3b8; margin-top: 4px; }
  .ok { color: #15803d; }
  .bad { color: #b91c1c; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; }
  a.btn {
    display: inline-block;
    background: #0155d2;
    color: #fff;
    text-decoration: none;
    padding: 12px 20px;
    border-radius: 12px;
    font-weight: 700;
  }
  a.btn.secondary {
    background: transparent;
    color: #0155d2;
    border: 1px solid #cbd5e1;
  }
</style>
</head>
<body>
  <div class="card">
    <h1 id="title">در حال بررسی…</h1>
    <p id="body"></p>
    <p id="meta" class="meta"></p>
    <div class="actions">
      <a class="btn" id="primaryLink" href="/index.html">بازگشت به پنل</a>
      <a class="btn secondary" id="secondaryLink" href="/login.html" hidden>ورود مجدد</a>
    </div>
  </div>
  <script>
    const PLAN_LABELS = { gold: 'طلایی', diamond: 'الماسی', trial: 'آزمایشی' }
    const q = new URLSearchParams(location.search)
    const status = q.get('status') || ''
    const title = document.getElementById('title')
    const body = document.getElementById('body')
    const meta = document.getElementById('meta')
    const secondary = document.getElementById('secondaryLink')
    const plan = PLAN_LABELS[q.get('plan')] || q.get('plan') || '—'
    const ref = q.get('ref') || '—'
    const invoice = q.get('invoice') || ''
    const ends = q.get('ends_at') || ''

    if (status === 'ok') {
      title.textContent = 'پرداخت با موفقیت انجام شد'
      title.className = 'ok'
      body.textContent = 'اشتراک سازمان شما فعال شد. می‌توانید به پنل برگردید و از امکانات پلن استفاده کنید.'
      meta.textContent = [
        `پلن: ${plan}`,
        `پیگیری: ${ref}`,
        invoice ? `فاکتور: ${invoice}` : '',
        ends ? `اعتبار تا: ${ends}` : ''
      ].filter(Boolean).join(' · ')
    } else if (status === 'cancelled') {
      title.textContent = 'پرداخت لغو شد'
      title.className = 'bad'
      body.textContent = 'تراکنش توسط شما لغو شد یا ناتمام ماند. اشتراکتان تغییر نکرده است؛ هر زمان خواستید دوباره از وضعیت اشتراک اقدام کنید.'
    } else if (status === 'failed') {
      title.textContent = 'پرداخت ناموفق بود'
      title.className = 'bad'
      body.textContent = 'تأیید تراکنش ناموفق بود. اگر مبلغی از حساب کسر شده، با پشتیبانی تماس بگیرید و شماره پیگیری درگاه را اعلام کنید.'
      secondary.hidden = false
    } else {
      title.textContent = 'نتیجه پرداخت نامشخص'
      title.className = 'bad'
      body.textContent = q.get('message') === 'payment_not_found'
        ? 'شناسه پرداخت پیدا نشد. اگر پول کسر شده با پشتیبانی تماس بگیرید.'
        : (q.get('message') || 'نتیجه نامشخص است. به پنل برگردید یا دوباره وارد شوید.')
      secondary.hidden = false
    }
  </script>
</body>
</html>
