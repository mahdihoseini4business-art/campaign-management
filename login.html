<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0155d2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ورود - اوکی یار (نسخه آزمایشی)</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Vazirmatn', 'Segoe UI', Tahoma, system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #e6effa 0%, #f0f5fc 100%);
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }

  .login-card {
    background: #FFFFFF;
    border-radius: 24px;
    box-shadow: 0 8px 32px rgba(1,85,210,0.12);
    width: 100%;
    max-width: 400px;
    padding: 48px 36px;
    text-align: center;
    animation: fadeIn 0.4s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-20px); }
    to { opacity: 1; transform: translateX(0); }
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  .login-logo {
    width: 200px;
    object-fit: contain;
    margin-bottom: 20px;
    border-radius: 16px;
  }

  .login-card h2 {
    font-size: 24px;
    font-weight: 700;
    color: #1C1917;
    margin-bottom: 8px;
  }

  .login-subtitle {
    font-size: 14px;
    color: #78716C;
    margin-bottom: 32px;
  }

  .login-error {
    background: #FEF2F2;
    color: #EF4444;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 20px;
    display: none;
    border: 1px solid rgba(239,68,68,0.2);
    animation: slideIn 0.3s ease;
  }

  .login-error.show { display: block; }

  .login-success {
    background: #F0FDF4;
    color: #16A34A;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 20px;
    display: none;
    border: 1px solid rgba(22,163,74,0.2);
    animation: slideIn 0.3s ease;
  }

  .login-success.show { display: block; }

  .form-group { margin-bottom: 20px; text-align: right; }

  .form-group label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
    color: #57534E;
  }

  .phone-input-wrapper {
    display: flex;
    align-items: center;
    border: 1.5px solid #D6D3D1;
    border-radius: 12px;
    overflow: hidden;
    transition: all 0.2s ease;
    background: #FFFFFF;
  }

  .phone-input-wrapper:hover { border-color: #A8A29E; }

  .phone-input-wrapper:focus-within {
    border-color: #25b88b;
    box-shadow: 0 0 0 3px rgba(37,184,139,0.15);
  }

  .phone-prefix {
    padding: 12px 16px;
    background: #F5F5F4;
    font-size: 14px;
    font-weight: 600;
    color: #57534E;
    border-left: 1px solid #D6D3D1;
    white-space: nowrap;
  }

  .phone-input {
    flex: 1;
    padding: 12px 16px;
    border: none;
    font-size: 16px;
    font-family: inherit;
    outline: none;
    background: transparent;
    color: #1C1917;
    direction: ltr;
    text-align: left;
    letter-spacing: 2px;
  }

  .phone-input::placeholder {
    color: #A8A29E;
    letter-spacing: 0;
  }

  .otp-inputs {
    display: flex;
    gap: 8px;
    justify-content: center;
    direction: ltr;
    margin-bottom: 24px;
  }

  .otp-input {
    width: 52px;
    height: 60px;
    text-align: center;
    font-size: 24px;
    font-weight: 700;
    font-family: 'Vazirmatn', sans-serif;
    border: 2px solid #D6D3D1;
    border-radius: 12px;
    outline: none;
    transition: all 0.2s ease;
    background: #FFFFFF;
    color: #1C1917;
  }

  .otp-input:focus {
    border-color: #25b88b;
    box-shadow: 0 0 0 3px rgba(37,184,139,0.15);
    animation: pulse 0.3s ease;
  }

  .otp-input.filled {
    border-color: #16A34A;
    background: #F0FDF4;
  }

  .otp-input.error {
    border-color: #EF4444;
    background: #FEF2F2;
    animation: shake 0.5s ease;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-5px); }
    40% { transform: translateX(5px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }

  .btn-login {
    width: 100%;
    padding: 14px;
    background: #25b88b;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: inherit;
    height: 48px;
    margin-top: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-login:hover { background: #1e9e77; box-shadow: 0 4px 12px rgba(37,184,139,0.3); }
  .btn-login:active { transform: scale(0.98); }
  .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

  .btn-login .spinner {
    width: 20px;
    height: 20px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: none;
  }

  .btn-login.loading .spinner { display: block; }
  .btn-login.loading .btn-text { display: none; }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .otp-info {
    font-size: 13px;
    color: #78716C;
    margin-bottom: 24px;
    line-height: 1.6;
  }

  .otp-info strong {
    color: #1C1917;
    font-weight: 600;
  }

  .otp-phone-mask {
    direction: ltr;
    font-family: monospace;
  }

  .resend-section {
    margin-top: 20px;
    font-size: 13px;
    color: #78716C;
  }

  .resend-timer {
    color: #25b88b;
    font-weight: 600;
    font-family: monospace;
    direction: ltr;
    display: inline-block;
    min-width: 50px;
  }

  .resend-btn {
    background: none;
    border: none;
    color: #25b88b;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    padding: 4px 8px;
    border-radius: 6px;
    transition: all 0.2s ease;
  }

  .resend-btn:hover { background: #e8f8f2; }
  .resend-btn:disabled { color: #A8A29E; cursor: not-allowed; }
  .resend-btn:disabled:hover { background: transparent; }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    color: #78716C;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    padding: 8px 12px;
    border-radius: 8px;
    transition: all 0.2s ease;
    margin-top: 16px;
  }

  .back-btn:hover { background: #F5F5F4; color: #1C1917; }

  .step-indicator {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 24px;
  }

  .step-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #D6D3D1;
    transition: all 0.3s ease;
  }

  .step-dot.active { background: #25b88b; width: 24px; border-radius: 4px; }
  .step-dot.completed { background: #16A34A; }

  /* Responsive */
  @media (max-width: 480px) {
    body { padding: 16px; }
    .login-card { padding: 28px 20px; border-radius: 16px; }
    .login-logo { width: 120px; height: 120px; margin-bottom: 16px; }
    .login-card h2 { font-size: 20px; }
    .otp-input { width: 44px; height: 52px; font-size: 20px; }
  }

  @media (max-width: 360px) {
    .login-logo { width: 100px; height: 100px; }
    .otp-input { width: 38px; height: 46px; font-size: 18px; gap: 4px; }
    .login-card { padding: 24px 16px; }
  }
</style>
</head>
<body>

<div class="login-card">
  <img src="/logo.webp" alt="لوگو" class="login-logo">

  <!-- مرحله ۱: ورود شماره -->
  <div id="step1">
    <h2>ورود با شماره موبایل</h2>
    <div class="login-subtitle">شماره موبایل خود را وارد کنید</div>

    <div class="step-indicator">
      <div class="step-dot active"></div>
      <div class="step-dot"></div>
    </div>

    <div class="login-error" id="error1"></div>

    <div class="form-group">
      <label for="phoneNumber">شماره موبایل</label>
      <div class="phone-input-wrapper">
        <input type="tel" class="phone-input" id="phoneNumber"
               placeholder="09123456789"
               inputmode="tel"
               maxlength="11"
               autocomplete="tel">
        <div class="phone-prefix">🇮🇷</div>
      </div>
    </div>

    <button type="button" class="btn-login" id="sendOtpBtn" onclick="handleSendOTP()">
      <span class="btn-text">ارسال کد تأیید</span>
      <div class="spinner"></div>
    </button>
  </div>

  <!-- مرحله ۲: تأیید کد -->
  <div id="step2" style="display:none;">
    <h2>کد تأیید را وارد کنید</h2>
    <div class="otp-info">
      کد ۴ رقمی به شماره<br>
      <strong class="otp-phone-mask" id="otpPhoneDisplay"></strong><br>
      ارسال شد
    </div>

    <div class="step-indicator">
      <div class="step-dot completed"></div>
      <div class="step-dot active"></div>
    </div>

    <div class="login-error" id="error2"></div>
    <div class="login-success" id="success2"></div>

    <div class="otp-inputs">
      <input type="tel" class="otp-input" maxlength="1" inputmode="numeric" data-index="0">
      <input type="tel" class="otp-input" maxlength="1" inputmode="numeric" data-index="1">
      <input type="tel" class="otp-input" maxlength="1" inputmode="numeric" data-index="2">
      <input type="tel" class="otp-input" maxlength="1" inputmode="numeric" data-index="3">
    </div>

    <button type="button" class="btn-login" id="verifyOtpBtn" onclick="handleVerifyOTP()" disabled>
      <span class="btn-text">تأیید کد</span>
      <div class="spinner"></div>
    </button>

    <div class="resend-section">
      <span id="resendTimer" style="display:none;">
        ارسال مجدد کد در <span class="resend-timer" id="timerDisplay">۰۲:۰۰</span>
      </span>
      <button type="button" class="resend-btn" id="resendBtn" onclick="handleResendOTP()" style="display:none;">
        ارسال مجدد کد
      </button>
    </div>

    <button type="button" class="back-btn" onclick="goToStep1()">
      ← بازگشت
    </button>
  </div>
</div>

<script type="module">
  import { supabase } from './src/supabase.js'
  import { setCurrentUser, restoreSession, toEnDigits } from './src/utils.js'
  import { sendOTP, verifyOTP } from './src/sms.js'

  // State
  let currentPhone = ''
  let resendInterval = null
  let resendTimeout = 120 // 2 minutes in seconds

  // Check if already logged in (signed session only)
  restoreSession().then(user => {
    if (user) window.location.href = '/index.html'
  })

  // ============================================
  // Step 1: Send OTP
  // ============================================

  window.handleSendOTP = async function() {
    const phoneInput = document.getElementById('phoneNumber')
    const phone = toEnDigits(phoneInput.value.replace(/\s/g, ''))
    const errorEl = document.getElementById('error1')
    const sendBtn = document.getElementById('sendOtpBtn')

    // Validate phone
    if (!phone || phone.length < 10 || !phone.startsWith('09')) {
      errorEl.textContent = 'لطفاً شماره موبایل صحیح وارد کنید (مثال: ۰۹۱۲۳۴۵۶۷۸۹)'
      errorEl.classList.add('show')
      return
    }

    errorEl.classList.remove('show')
    sendBtn.classList.add('loading')
    sendBtn.disabled = true

    try {
      const result = await sendOTP(phone)

      if (result.success) {
        currentPhone = phone
        goToStep2(phone)
      } else {
        errorEl.textContent = result.error || 'خطا در ارسال کد تأیید'
        errorEl.classList.add('show')
      }
    } catch (e) {
      console.error('Send OTP error:', e)
      errorEl.textContent = 'خطا در اتصال به سرور'
      errorEl.classList.add('show')
    } finally {
      sendBtn.classList.remove('loading')
      sendBtn.disabled = false
    }
  }

  // ============================================
  // Step 2: Verify OTP
  // ============================================

  let isVerifyingOTP = false

  window.handleVerifyOTP = async function() {
    if (isVerifyingOTP) return

    const otpInputs = document.querySelectorAll('.otp-input')
    const code = Array.from(otpInputs).map(input => input.value).join('')
    const errorEl = document.getElementById('error2')
    const successEl = document.getElementById('success2')
    const verifyBtn = document.getElementById('verifyOtpBtn')

    if (code.length !== 4) {
      errorEl.textContent = 'لطفاً کد ۴ رقمی را کامل وارد کنید'
      errorEl.classList.add('show')
      return
    }

    isVerifyingOTP = true
    errorEl.classList.remove('show')
    successEl.classList.remove('show')
    verifyBtn.classList.add('loading')
    verifyBtn.disabled = true
    otpInputs.forEach(input => { input.disabled = true })

    try {
      const result = await verifyOTP(currentPhone, code)

      if (result.success && result.user) {
        successEl.textContent = 'تأیید موفقیت‌آمیز! در حال انتقال...'
        successEl.classList.add('show')

        // Set user session
        await setCurrentUser({
          username: result.user.username,
          displayName: result.user.display_name || `${result.user.first_name || ''} ${result.user.last_name || ''}`.trim(),
          firstName: result.user.first_name,
          lastName: result.user.last_name,
          phone: result.user.phone,
          role: result.user.role,
          permissions: result.user.permissions || null
        })

        // Redirect after short delay
        setTimeout(() => {
          window.location.href = '/index.html'
        }, 800)
      } else {
        errorEl.textContent = result.error || 'کد تأیید نادرست است'
        errorEl.classList.add('show')

        // Mark inputs as error
        otpInputs.forEach(input => {
          input.classList.add('error')
          setTimeout(() => input.classList.remove('error'), 500)
        })

        // Clear inputs
        otpInputs.forEach(input => { input.value = ''; input.disabled = false })
        otpInputs[0].focus()
        updateVerifyButton()
      }
    } catch (e) {
      console.error('Verify OTP error:', e)
      errorEl.textContent = 'خطا در اتصال به سرور'
      errorEl.classList.add('show')
      otpInputs.forEach(input => { input.disabled = false })
    } finally {
      isVerifyingOTP = false
      verifyBtn.classList.remove('loading')
      const codeLeft = Array.from(document.querySelectorAll('.otp-input')).map(i => i.value).join('')
      verifyBtn.disabled = codeLeft.length !== 4
    }
  }

  // ============================================
  // Resend OTP
  // ============================================

  window.handleResendOTP = async function() {
    const resendBtn = document.getElementById('resendBtn')
    const timerDisplay = document.getElementById('resendTimer')

    resendBtn.disabled = true
    resendBtn.style.display = 'none'
    timerDisplay.style.display = 'none'

    try {
      const result = await sendOTP(currentPhone)
      if (result.success) {
        startResendTimer()
      }
    } catch (e) {
      console.error('Resend OTP error:', e)
    }
  }

  function startResendTimer() {
    resendTimeout = 120
    const timerDisplay = document.getElementById('resendTimer')
    const timerValue = document.getElementById('timerDisplay')
    const resendBtn = document.getElementById('resendBtn')

    timerDisplay.style.display = 'inline'
    resendBtn.style.display = 'none'

    if (resendInterval) clearInterval(resendInterval)

    resendInterval = setInterval(() => {
      resendTimeout--
      const minutes = Math.floor(resendTimeout / 60)
      const seconds = resendTimeout % 60
      timerValue.textContent = `${String(minutes).padStart(2, '۰')}:${String(seconds).padStart(2, '۰')}`

      if (resendTimeout <= 0) {
        clearInterval(resendInterval)
        timerDisplay.style.display = 'none'
        resendBtn.style.display = 'inline'
        resendBtn.disabled = false
      }
    }, 1000)
  }

  // ============================================
  // Navigation
  // ============================================

  function goToStep2(phone) {
    document.getElementById('step1').style.display = 'none'
    document.getElementById('step2').style.display = 'block'
    document.getElementById('otpPhoneDisplay').textContent = formatPhoneDisplay(phone)

    // Clear and focus first OTP input
    const otpInputs = document.querySelectorAll('.otp-input')
    otpInputs.forEach(input => { input.value = ''; input.classList.remove('filled', 'error') })
    otpInputs[0].focus()

    startResendTimer()
    updateVerifyButton()
  }

  window.goToStep1 = function() {
    if (resendInterval) clearInterval(resendInterval)
    document.getElementById('step2').style.display = 'none'
    document.getElementById('step1').style.display = 'block'
    document.getElementById('error2').classList.remove('show')
    document.getElementById('success2').classList.remove('show')
  }

  function formatPhoneDisplay(phone) {
    return phone
  }

  // ============================================
  // OTP Input Handling
  // ============================================

  const otpInputs = document.querySelectorAll('.otp-input')

  otpInputs.forEach((input, index) => {
    // Handle input
    input.addEventListener('input', (e) => {
      const value = e.target.value.replace(/[^0-9]/g, '')
      e.target.value = value

      if (value) {
        e.target.classList.add('filled')
        if (index < otpInputs.length - 1) {
          otpInputs[index + 1].focus()
        }
      } else {
        e.target.classList.remove('filled')
      }

      updateVerifyButton()
    })

    // Handle keydown
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !e.target.value && index > 0) {
        otpInputs[index - 1].focus()
        otpInputs[index - 1].value = ''
        otpInputs[index - 1].classList.remove('filled')
        updateVerifyButton()
      }

      if (e.key === 'Enter') {
        handleVerifyOTP()
      }
    })

    // Handle paste
    input.addEventListener('paste', (e) => {
      e.preventDefault()
      const pastedData = e.clipboardData.getData('text').replace(/[^0-9]/g, '')

      if (pastedData.length >= 4) {
        for (let i = 0; i < 4 && i < pastedData.length; i++) {
          otpInputs[i].value = pastedData[i]
          otpInputs[i].classList.add('filled')
        }
        otpInputs[3].focus()
        updateVerifyButton()
      }
    })

    // Handle focus
    input.addEventListener('focus', () => {
      input.select()
    })
  })

  function updateVerifyButton() {
    const code = Array.from(otpInputs).map(input => input.value).join('')
    const verifyBtn = document.getElementById('verifyOtpBtn')
    verifyBtn.disabled = code.length !== 4 || isVerifyingOTP

    // Auto-submit as soon as all 4 digits are entered
    if (code.length === 4 && !isVerifyingOTP) {
      handleVerifyOTP()
    }
  }

  // ============================================
  // Phone Input Formatting
  // ============================================

  const phoneInput = document.getElementById('phoneNumber')

  phoneInput.addEventListener('input', (e) => {
    let value = e.target.value.replace(/[^0-9]/g, '')
    if (value.length > 11) value = value.slice(0, 11)
    e.target.value = value
  })

  phoneInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      handleSendOTP()
    }
  })

</script>

</body>
</html>
