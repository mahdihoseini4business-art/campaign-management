<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1D1C74">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ورود - سیستم مدیریت کمپین</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Vazirmatn', 'Segoe UI', Tahoma, system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0f0f4e 0%, #1D1C74 40%, #2a2990 70%, #1D1C74 100%);
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  .login-card {
    background: #FFFFFF;
    border-radius: 24px;
    box-shadow: 0 16px 48px rgba(29,28,116,0.25);
    width: 100%;
    max-width: 400px;
    padding: 48px 36px;
    text-align: center;
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .login-icon { font-size: 52px; margin-bottom: 20px; }
  .login-card h2 {
    font-size: 24px;
    font-weight: 700;
    color: #1C1917;
    margin-bottom: 8px;
  }
  .login-subtitle {
    font-size: 14px;
    color: #78716C;
    margin-bottom: 32px;
  }
  .login-error {
    background: #FEF2F2;
    color: #EF4444;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 20px;
    display: none;
    border: 1px solid rgba(239,68,68,0.2);
  }
  .login-error.show { display: block; }
  .form-group { margin-bottom: 20px; text-align: right; }
  .form-group label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
    color: #57534E;
  }
  .form-input {
    width: 100%;
    padding: 12px 16px;
    border: 1.5px solid #D6D3D1;
    border-radius: 12px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: all 0.2s ease;
    background: #FFFFFF;
    color: #1C1917;
    height: 44px;
  }
  .form-input:hover { border-color: #A8A29E; }
  .form-input:focus {
    border-color: #ED1C24;
    box-shadow: 0 0 0 3px rgba(237,28,36,0.15);
  }
  .btn-login {
    width: 100%;
    padding: 14px;
    background: #ED1C24;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: inherit;
    height: 48px;
    margin-top: 8px;
  }
  .btn-login:hover { background: #c41820; box-shadow: 0 4px 12px rgba(237,28,36,0.3); }
  .btn-login:active { transform: scale(0.98); }
  @media (max-width: 480px) {
    .login-card { padding: 32px 24px; border-radius: 16px; }
  }
</style>
</head>
<body>

<div class="login-card">
  <div class="login-icon">🔐</div>
  <h2>ورود به سیستم</h2>
  <div class="login-subtitle">مدیریت کمپین دیجیتال مارکتینگ</div>
  <div class="login-error" id="loginError">نام کاربری یا رمز عبور اشتباه است</div>
  <form id="loginForm" onsubmit="return false;">
    <div class="form-group">
      <label>نام کاربری</label>
      <input type="text" class="form-input" id="loginUsername" placeholder="نام کاربری" autofocus autocomplete="username">
    </div>
    <div class="form-group">
      <label>رمز عبور</label>
      <input type="password" class="form-input" id="loginPassword" placeholder="رمز عبور" autocomplete="current-password">
    </div>
    <button type="submit" class="btn-login" id="loginBtn">ورود</button>
  </form>
</div>

<script type="module">
  import { supabase } from './src/supabase.js'
  import { hashPassword, seedAdmin } from './src/auth.js'
  import { setCurrentUser, toEnDigits } from './src/utils.js'

  // If already logged in, redirect to main page
  const existingUser = localStorage.getItem('campaign_user')
  if (existingUser) {
    window.location.href = '/index.html'
  }

  // Seed admin
  await seedAdmin()

  const loginForm = document.getElementById('loginForm')
  const loginBtn = document.getElementById('loginBtn')
  const errorEl = document.getElementById('loginError')

  async function doLogin() {
    const username = toEnDigits(document.getElementById('loginUsername').value.trim())
    const password = toEnDigits(document.getElementById('loginPassword').value)

    if (!username || !password) {
      errorEl.textContent = 'نام کاربری و رمز عبور را وارد کنید'
      errorEl.classList.add('show')
      document.getElementById('loginPassword').value = ''
      return
    }

    loginBtn.textContent = 'در حال ورود...'
    loginBtn.disabled = true

    const hash = await hashPassword(password, username)
    const { data: user, error } = await supabase
      .from('users')
      .select('*')
      .eq('username', username)
      .eq('password_hash', hash)
      .single()

    if (error || !user) {
      errorEl.textContent = 'نام کاربری یا رمز عبور اشتباه است'
      errorEl.classList.add('show')
      document.getElementById('loginPassword').value = ''
      loginBtn.textContent = 'ورود'
      loginBtn.disabled = false
      return
    }

    setCurrentUser({ username: user.username, displayName: user.display_name, role: user.role, permissions: user.permissions || null })
    window.location.href = '/index.html'
  }

  loginForm.addEventListener('submit', (e) => { e.preventDefault(); doLogin() })
  document.getElementById('loginPassword').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin() })
</script>

</body>
</html>
