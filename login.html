<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0155d2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ورود - CARNO - سیستم مدیریت عملکرد سازمان</title>
<link rel="icon" type="image/webp" href="/icon.webp">
<link rel="apple-touch-icon" href="/icon.webp">
<link rel="stylesheet" href="/fonts/vazirmatn.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Vazirmatn', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #e6effa 0%, #f0f5fc 100%);
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }

  .login-card {
    background: #FFFFFF;
    border-radius: 24px;
    box-shadow: 0 8px 32px rgba(1,85,210,0.12);
    width: 100%;
    max-width: 400px;
    padding: 48px 36px;
    text-align: center;
    animation: fadeIn 0.4s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-20px); }
    to { opacity: 1; transform: translateX(0); }
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  .login-logo {
    width: 200px;
    object-fit: contain;
    margin-bottom: 20px;
    border-radius: 16px;
  }

  .login-card h2 {
    font-size: 24px;
    font-weight: 700;
    color: #1C1917;
    margin-bottom: 8px;
  }

  .login-subtitle {
    font-size: 14px;
    color: #78716C;
    margin-bottom: 32px;
  }

  .login-error {
    background: #FEF2F2;
    color: #EF4444;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 20px;
    display: none;
    border: 1px solid rgba(239,68,68,0.2);
    animation: slideIn 0.3s ease;
  }

  .login-error.show { display: block; }

  .login-success {
    background: #F0FDF4;
    color: #16A34A;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 20px;
    display: none;
    border: 1px solid rgba(22,163,74,0.2);
    animation: slideIn 0.3s ease;
  }

  .login-success.show { display: block; }

  .form-group { margin-bottom: 20px; text-align: right; }

  .form-group label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
    color: #57534E;
  }

  .phone-input-wrapper {
    display: flex;
    align-items: center;
    border: 1.5px solid #D6D3D1;
    border-radius: 12px;
    overflow: hidden;
    transition: all 0.2s ease;
    background: #FFFFFF;
  }

  .phone-input-wrapper:hover { border-color: #A8A29E; }

  .phone-input-wrapper:focus-within {
    border-color: #25b88b;
    box-shadow: 0 0 0 3px rgba(37,184,139,0.15);
  }

  .phone-prefix {
    padding: 12px 16px;
    background: #F5F5F4;
    font-size: 14px;
    font-weight: 600;
    color: #57534E;
    border-left: 1px solid #D6D3D1;
    white-space: nowrap;
  }

  .phone-input {
    flex: 1;
    padding: 12px 16px;
    border: none;
    font-size: 16px;
    font-family: inherit;
    outline: none;
    background: transparent;
    color: #1C1917;
    direction: ltr;
    text-align: left;
    letter-spacing: 2px;
  }

  .phone-input::placeholder {
    color: #A8A29E;
    letter-spacing: 0;
  }

  .otp-inputs {
    display: flex;
    gap: 8px;
    justify-content: center;
    direction: ltr;
    margin-bottom: 24px;
  }

  .otp-input {
    width: 52px;
    height: 60px;
    text-align: center;
    font-size: 24px;
    font-weight: 700;
    font-family: 'Vazirmatn', sans-serif;
    border: 2px solid #D6D3D1;
    border-radius: 12px;
    outline: none;
    transition: all 0.2s ease;
    background: #FFFFFF;
    color: #1C1917;
  }

  .otp-input:focus {
    border-color: #25b88b;
    box-shadow: 0 0 0 3px rgba(37,184,139,0.15);
    animation: pulse 0.3s ease;
  }

  .otp-input.filled {
    border-color: #16A34A;
    background: #F0FDF4;
  }

  .otp-input.error {
    border-color: #EF4444;
    background: #FEF2F2;
    animation: shake 0.5s ease;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-5px); }
    40% { transform: translateX(5px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }

  .btn-login {
    width: 100%;
    padding: 14px;
    background: #25b88b;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: inherit;
    height: 48px;
    margin-top: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-login:hover { background: #1e9e77; box-shadow: 0 4px 12px rgba(37,184,139,0.3); }
  .btn-login:active { transform: scale(0.98); }
  .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

  .btn-login .spinner {
    width: 20px;
    height: 20px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: none;
  }

  .btn-login.loading .spinner { display: block; }
  .btn-login.loading .btn-text { display: none; }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .otp-info {
    font-size: 13px;
    color: #78716C;
    margin-bottom: 24px;
    line-height: 1.6;
  }

  .otp-info strong {
    color: #1C1917;
    font-weight: 600;
  }

  .otp-phone-mask {
    direction: ltr;
    unicode-bidi: isolate;
    font-family: inherit;
    font-weight: 600;
  }

  .resend-section {
    margin-top: 20px;
    font-size: 13px;
    color: #78716C;
  }

  .resend-timer {
    color: #25b88b;
    font-weight: 600;
    font-family: inherit;
    direction: ltr;
    unicode-bidi: isolate;
    display: inline-block;
    min-width: 3.5em;
    font-variant-numeric: tabular-nums;
  }

  .resend-btn {
    background: none;
    border: none;
    color: #25b88b;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    padding: 4px 8px;
    border-radius: 6px;
    transition: all 0.2s ease;
  }

  .resend-btn:hover { background: #e8f8f2; }
  .resend-btn:disabled { color: #A8A29E; cursor: not-allowed; }
  .resend-btn:disabled:hover { background: transparent; }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    color: #78716C;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    padding: 8px 12px;
    border-radius: 8px;
    transition: all 0.2s ease;
    margin-top: 16px;
  }

  .back-btn:hover { background: #F5F5F4; color: #1C1917; }

  .step-indicator {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 24px;
    transition: opacity 0.25s ease, transform 0.25s ease, max-height 0.25s ease, margin 0.25s ease;
  }

  .step-indicator.is-hidden {
    opacity: 0;
    transform: scale(0.9);
    max-height: 0;
    margin-bottom: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .step-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #D6D3D1;
    transition:
      width 0.4s cubic-bezier(0.22, 1, 0.36, 1),
      background 0.35s ease,
      border-radius 0.35s ease,
      transform 0.35s ease;
  }

  .step-dot.active {
    background: #25b88b;
    width: 24px;
    border-radius: 4px;
    transform: scaleY(1.15);
  }

  .step-dot.completed {
    background: #16A34A;
    transform: scale(1.05);
  }

  .login-stages {
    position: relative;
    overflow: hidden;
  }

  .login-stage {
    display: none;
  }

  .login-stage.is-active {
    display: block;
  }

  .login-stage.is-entering-forward {
    display: block;
    animation: stageEnterForward 0.42s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .login-stage.is-entering-back {
    display: block;
    animation: stageEnterBack 0.42s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .login-stage.is-leaving-forward {
    display: block;
    position: absolute;
    inset-inline: 0;
    top: 0;
    width: 100%;
    pointer-events: none;
    animation: stageLeaveForward 0.32s ease both;
  }

  .login-stage.is-leaving-back {
    display: block;
    position: absolute;
    inset-inline: 0;
    top: 0;
    width: 100%;
    pointer-events: none;
    animation: stageLeaveBack 0.32s ease both;
  }

  .login-card.is-stage-shifting {
    animation: cardStageShift 0.45s cubic-bezier(0.22, 1, 0.36, 1);
  }

  @keyframes stageEnterForward {
    from { opacity: 0; transform: translateX(-28px); }
    to { opacity: 1; transform: translateX(0); }
  }

  @keyframes stageLeaveForward {
    from { opacity: 1; transform: translateX(0); }
    to { opacity: 0; transform: translateX(28px); }
  }

  @keyframes stageEnterBack {
    from { opacity: 0; transform: translateX(28px); }
    to { opacity: 1; transform: translateX(0); }
  }

  @keyframes stageLeaveBack {
    from { opacity: 1; transform: translateX(0); }
    to { opacity: 0; transform: translateX(-28px); }
  }

  @keyframes cardStageShift {
    0% { transform: translateY(0) scale(1); }
    40% { transform: translateY(4px) scale(0.985); }
    100% { transform: translateY(0) scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .login-stage.is-entering-forward,
    .login-stage.is-entering-back,
    .login-stage.is-leaving-forward,
    .login-stage.is-leaving-back,
    .login-card.is-stage-shifting {
      animation: none;
    }
    .step-dot { transition: none; }
  }

  .app-update-banner {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 12000;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    padding: 10px 16px;
    background: #0f172a;
    color: #f8fafc;
    font-size: 13px;
    font-family: 'Vazirmatn', sans-serif;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.18);
  }
  .app-update-banner.is-visible { display: flex; }
  .app-update-banner-text { text-align: center; }
  .app-update-btn {
    border: none;
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    background: #0155d2;
    color: #fff;
  }
  .app-update-btn:hover { background: #0146b0; }

  /* Responsive */
  @media (max-width: 480px) {
    body { padding: 16px; }
    .login-card { padding: 28px 20px; border-radius: 16px; }
    .login-logo { width: 120px; height: 120px; margin-bottom: 16px; }
    .login-card h2 { font-size: 20px; }
    .otp-input { width: 44px; height: 52px; font-size: 20px; }
  }

  @media (max-width: 360px) {
    .login-logo { width: 100px; height: 100px; }
    .otp-input { width: 38px; height: 46px; font-size: 18px; gap: 4px; }
    .login-card { padding: 24px 16px; }
  }
</style>
</head>
<body>

<div id="appUpdateBanner" class="app-update-banner" hidden role="status" aria-live="polite">
  <span class="app-update-banner-text">نسخه جدید آماده است. برای اعمال بروزرسانی کنید.</span>
  <button type="button" class="app-update-btn" id="appUpdateReloadBtn">بروزرسانی</button>
</div>

<div class="login-card" id="loginCard">
  <img src="/logo.webp" alt="سیستم مدیریت عملکرد سازمان کارنو" class="login-logo">

  <div class="step-indicator" id="stepIndicator" aria-hidden="true">
    <div class="step-dot active" data-dot="1"></div>
    <div class="step-dot" data-dot="2"></div>
  </div>

  <div class="login-stages">
    <!-- مرحله ۱: ورود شماره -->
    <div id="step1" class="login-stage is-active">
      <h2>ورود با شماره موبایل</h2>
      <div class="login-subtitle">شماره موبایل خود را وارد کنید</div>

      <div class="login-error" id="error1"></div>

      <div class="form-group">
        <label for="phoneNumber">شماره موبایل</label>
        <div class="phone-input-wrapper">
          <input type="tel" class="phone-input" id="phoneNumber"
                 placeholder="09123456789"
                 inputmode="tel"
                 maxlength="11"
                 autocomplete="tel">
          <div class="phone-prefix">🇮🇷</div>
        </div>
      </div>

      <button type="button" class="btn-login" id="sendOtpBtn" onclick="handleSendOTP()">
        <span class="btn-text">ارسال کد تأیید</span>
        <div class="spinner"></div>
      </button>
    </div>

    <!-- مرحله ۲: تأیید کد -->
    <div id="step2" class="login-stage">
      <h2>کد تأیید را وارد کنید</h2>
      <div class="otp-info">
        کد ۴ رقمی به شماره
        <strong class="otp-phone-mask" id="otpPhoneDisplay"></strong>
        ارسال شد
      </div>

      <div class="login-error" id="error2"></div>
      <div class="login-success" id="success2"></div>

      <div class="otp-inputs">
        <input type="tel" class="otp-input" maxlength="1" inputmode="numeric" data-index="0">
        <input type="tel" class="otp-input" maxlength="1" inputmode="numeric" data-index="1">
        <input type="tel" class="otp-input" maxlength="1" inputmode="numeric" data-index="2">
        <input type="tel" class="otp-input" maxlength="1" inputmode="numeric" data-index="3">
      </div>

      <button type="button" class="btn-login" id="verifyOtpBtn" onclick="handleVerifyOTP()" disabled>
        <span class="btn-text">تأیید کد</span>
        <div class="spinner"></div>
      </button>

      <div class="resend-section">
        <span id="resendTimer" style="display:none;">
          ارسال مجدد کد در <span class="resend-timer" id="timerDisplay">۰۲:۰۰</span>
        </span>
        <button type="button" class="resend-btn" id="resendBtn" onclick="handleResendOTP()" style="display:none;">
          ارسال مجدد کد
        </button>
      </div>

      <button type="button" class="back-btn" onclick="goToStep1()">
        ← بازگشت
      </button>
    </div>

    <!-- مرحله ۳: انتخاب سازمان (فقط اگر بیش از یک عضویت) -->
    <div id="step3" class="login-stage">
      <h2>انتخاب سازمان</h2>
      <div class="otp-info">بیش از یک سازمان دارید؛ یکی را انتخاب کنید.</div>
      <div class="login-error" id="error3"></div>
      <div id="tenantList" style="display:flex;flex-direction:column;gap:10px;margin:16px 0;"></div>
    </div>
  </div>
</div>

<script type="module">
  import { setCurrentUser, restoreSession, toEnDigits, toFaDigits } from './src/utils.js'
  import { sendOTP, verifyOTP } from './src/sms.js'
  import { resolveGroupSessionInfo } from './src/groups.js'
  import { initAppUpdate } from './src/app-update.js'
  import {
    applyAuthSession,
    resolveTenantAfterLogin,
    setCurrentTenant,
    ensureTenantContextOnBoot
  } from './src/tenant.js'
  import { applyHostTenantHint } from './src/subdomain.js'

  initAppUpdate().catch(e => console.warn('app update init error:', e))
  applyHostTenantHint().catch(e => console.warn('host tenant hint', e))

  // State
  let currentPhone = ''
  let resendInterval = null
  let resendTimeout = 120 // 2 minutes in seconds
  let pendingLoginUser = null

  async function finishLogin(userPayload, tenant) {
    const groupInfo = await resolveGroupSessionInfo({
      phone: userPayload.phone,
      role: userPayload.role,
      permissions: userPayload.permissions || null
    })
    const permissions = userPayload.role === 'admin'
      ? null
      : { ...(userPayload.permissions || {}), viewUserPhones: groupInfo.viewUserPhones }
    await setCurrentUser({
      username: userPayload.username,
      displayName: userPayload.display_name || `${userPayload.first_name || ''} ${userPayload.last_name || ''}`.trim(),
      firstName: userPayload.first_name,
      lastName: userPayload.last_name,
      phone: userPayload.phone,
      role: userPayload.role,
      permissions,
      viewUserPhones: groupInfo.viewUserPhones,
      groupId: groupInfo.groupId,
      groupName: groupInfo.groupName,
      isGroupManager: groupInfo.isGroupManager,
      tenantId: tenant?.id || null,
      tenantName: tenant?.name || null
    })
    window.location.href = '/index.html'
  }

  function showTenantPicker(tenants) {
    transitionToStep(3, 'forward')
    const list = document.getElementById('tenantList')
    list.innerHTML = ''
    for (const t of tenants) {
      const btn = document.createElement('button')
      btn.type = 'button'
      btn.className = 'btn-login'
      btn.style.margin = '0'
      btn.innerHTML = `<span class="btn-text">${t.name || t.slug || t.id}</span>`
      btn.onclick = async () => {
        try {
          await setCurrentTenant(t.id)
          await finishLogin(pendingLoginUser, t)
        } catch (e) {
          console.error(e)
          const err = document.getElementById('error3')
          err.textContent = 'انتخاب سازمان ناموفق بود'
          err.classList.add('show')
        }
      }
      list.appendChild(btn)
    }
  }

  // Check if already logged in
  ;(async () => {
    const local = await restoreSession()
    const boot = await ensureTenantContextOnBoot()
    if (local && boot.ok) {
      window.location.href = '/index.html'
      return
    }
    if (boot.reason === 'needs_picker' && boot.tenants?.length) {
      pendingLoginUser = local || {
        username: local?.username,
        phone: local?.phone,
        role: local?.role,
        permissions: local?.permissions
      }
      // Prefer reloading profile from tenants flow after OTP; if only Auth left, force re-login
      if (local) {
        showTenantPicker(boot.tenants)
      }
    }
  })()

  // ============================================
  // Step 1: Send OTP
  // ============================================

  window.handleSendOTP = async function() {
    const phoneInput = document.getElementById('phoneNumber')
    const phone = toEnDigits(phoneInput.value.replace(/\s/g, ''))
    const errorEl = document.getElementById('error1')
    const sendBtn = document.getElementById('sendOtpBtn')

    // Validate phone
    if (!phone || phone.length < 10 || !phone.startsWith('09')) {
      errorEl.textContent = 'لطفاً شماره موبایل صحیح وارد کنید (مثال: ۰۹۱۲۳۴۵۶۷۸۹)'
      errorEl.classList.add('show')
      return
    }

    errorEl.classList.remove('show')
    sendBtn.classList.add('loading')
    sendBtn.disabled = true

    try {
      const result = await sendOTP(phone)

      if (result.success) {
        currentPhone = phone
        goToStep2(phone)
      } else {
        errorEl.textContent = result.error || 'خطا در ارسال کد تأیید'
        errorEl.classList.add('show')
      }
    } catch (e) {
      console.error('Send OTP error:', e)
      errorEl.textContent = 'خطا در اتصال به سرور'
      errorEl.classList.add('show')
    } finally {
      sendBtn.classList.remove('loading')
      sendBtn.disabled = false
    }
  }

  // ============================================
  // Step 2: Verify OTP
  // ============================================

  let isVerifyingOTP = false

  window.handleVerifyOTP = async function() {
    if (isVerifyingOTP) return

    const otpInputs = document.querySelectorAll('.otp-input')
    const code = Array.from(otpInputs).map(input => input.value).join('')
    const errorEl = document.getElementById('error2')
    const successEl = document.getElementById('success2')
    const verifyBtn = document.getElementById('verifyOtpBtn')

    if (code.length !== 4) {
      errorEl.textContent = 'لطفاً کد ۴ رقمی را کامل وارد کنید'
      errorEl.classList.add('show')
      return
    }

    isVerifyingOTP = true
    errorEl.classList.remove('show')
    successEl.classList.remove('show')
    verifyBtn.classList.add('loading')
    verifyBtn.disabled = true
    otpInputs.forEach(input => { input.disabled = true })

    try {
      const result = await verifyOTP(currentPhone, code)

      if (result.success && result.user && result.session) {
        await applyAuthSession(result.session)
        pendingLoginUser = result.user
        const resolved = await resolveTenantAfterLogin(result.tenants || [])
        if (!resolved.tenants.length) {
          errorEl.textContent = 'هیچ سازمانی برای این کاربر یافت نشد'
          errorEl.classList.add('show')
          otpInputs.forEach(input => { input.disabled = false })
          return
        }
        if (resolved.needsPicker) {
          showTenantPicker(resolved.tenants)
          return
        }
        successEl.textContent = 'تأیید موفقیت‌آمیز! در حال انتقال...'
        successEl.classList.add('show')
        await finishLogin(result.user, resolved.tenant)
      } else {
        errorEl.textContent = result.error || 'کد تأیید نادرست است'
        errorEl.classList.add('show')

        otpInputs.forEach(input => {
          input.classList.add('error')
          setTimeout(() => input.classList.remove('error'), 500)
        })

        otpInputs.forEach(input => { input.value = ''; input.disabled = false })
        otpInputs[0].focus()
        updateVerifyButton()
      }
    } catch (e) {
      console.error('Verify OTP error:', e)
      errorEl.textContent = 'خطا در اتصال به سرور'
      errorEl.classList.add('show')
      otpInputs.forEach(input => { input.disabled = false })
    } finally {
      isVerifyingOTP = false
      verifyBtn.classList.remove('loading')
      const codeLeft = Array.from(document.querySelectorAll('.otp-input')).map(i => i.value).join('')
      verifyBtn.disabled = codeLeft.length !== 4
    }
  }

  // ============================================
  // Resend OTP
  // ============================================

  window.handleResendOTP = async function() {
    const resendBtn = document.getElementById('resendBtn')
    const timerDisplay = document.getElementById('resendTimer')

    resendBtn.disabled = true
    resendBtn.style.display = 'none'
    timerDisplay.style.display = 'none'

    try {
      const result = await sendOTP(currentPhone)
      if (result.success) {
        startResendTimer()
      }
    } catch (e) {
      console.error('Resend OTP error:', e)
    }
  }

  function formatResendTimer(totalSeconds) {
    const minutes = Math.floor(totalSeconds / 60)
    const seconds = totalSeconds % 60
    const raw = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`
    return toFaDigits(raw)
  }

  function startResendTimer() {
    resendTimeout = 120
    const timerDisplay = document.getElementById('resendTimer')
    const timerValue = document.getElementById('timerDisplay')
    const resendBtn = document.getElementById('resendBtn')

    timerDisplay.style.display = 'inline'
    resendBtn.style.display = 'none'
    timerValue.textContent = formatResendTimer(resendTimeout)

    if (resendInterval) clearInterval(resendInterval)

    resendInterval = setInterval(() => {
      resendTimeout--
      timerValue.textContent = formatResendTimer(Math.max(0, resendTimeout))

      if (resendTimeout <= 0) {
        clearInterval(resendInterval)
        timerDisplay.style.display = 'none'
        resendBtn.style.display = 'inline'
        resendBtn.disabled = false
      }
    }, 1000)
  }

  // ============================================
  // Navigation
  // ============================================

  let currentLoginStep = 1
  let stageTransitionToken = 0

  function updateStepIndicator(step) {
    const indicator = document.getElementById('stepIndicator')
    const dots = indicator?.querySelectorAll('.step-dot')
    if (!indicator || !dots?.length) return

    if (step >= 3) {
      indicator.classList.add('is-hidden')
      return
    }

    indicator.classList.remove('is-hidden')
    dots.forEach((dot) => {
      const n = Number(dot.dataset.dot)
      dot.classList.toggle('completed', n < step)
      dot.classList.toggle('active', n === step)
    })
  }

  function transitionToStep(nextStep, direction = 'forward') {
    if (nextStep === currentLoginStep) {
      updateStepIndicator(nextStep)
      return
    }

    const card = document.getElementById('loginCard')
    const fromEl = document.getElementById(`step${currentLoginStep}`)
    const toEl = document.getElementById(`step${nextStep}`)
    if (!toEl) return

    const token = ++stageTransitionToken
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches
    const leaveClass = direction === 'back' ? 'is-leaving-back' : 'is-leaving-forward'
    const enterClass = direction === 'back' ? 'is-entering-back' : 'is-entering-forward'

    updateStepIndicator(nextStep)

    if (card) {
      card.classList.remove('is-stage-shifting')
      void card.offsetWidth
      if (!reduceMotion) card.classList.add('is-stage-shifting')
    }

    document.querySelectorAll('.login-stage').forEach((el) => {
      el.classList.remove(
        'is-active',
        'is-entering-forward',
        'is-entering-back',
        'is-leaving-forward',
        'is-leaving-back'
      )
    })

    if (fromEl && !reduceMotion) {
      fromEl.classList.add(leaveClass)
    }

    toEl.classList.add('is-active')
    if (!reduceMotion) toEl.classList.add(enterClass)

    currentLoginStep = nextStep

    const cleanup = () => {
      if (token !== stageTransitionToken) return
      document.querySelectorAll('.login-stage').forEach((el) => {
        el.classList.remove('is-leaving-forward', 'is-leaving-back', 'is-entering-forward', 'is-entering-back')
        if (el !== toEl) el.classList.remove('is-active')
      })
      toEl.classList.add('is-active')
      card?.classList.remove('is-stage-shifting')
    }

    if (reduceMotion) {
      cleanup()
      return
    }

    window.setTimeout(cleanup, 420)
  }

  function goToStep2(phone) {
    document.getElementById('otpPhoneDisplay').textContent = formatPhoneDisplay(phone)
    transitionToStep(2, 'forward')

    const otpInputs = document.querySelectorAll('.otp-input')
    otpInputs.forEach(input => { input.value = ''; input.classList.remove('filled', 'error') })
    window.setTimeout(() => otpInputs[0]?.focus(), 220)

    startResendTimer()
    updateVerifyButton()
  }

  window.goToStep1 = function() {
    if (resendInterval) clearInterval(resendInterval)
    document.getElementById('error2').classList.remove('show')
    document.getElementById('success2').classList.remove('show')
    transitionToStep(1, 'back')
  }

  function formatPhoneDisplay(phone) {
    return phone
  }

  // ============================================
  // OTP Input Handling
  // ============================================

  const otpInputs = document.querySelectorAll('.otp-input')

  otpInputs.forEach((input, index) => {
    // Handle input
    input.addEventListener('input', (e) => {
      const value = e.target.value.replace(/[^0-9]/g, '')
      e.target.value = value

      if (value) {
        e.target.classList.add('filled')
        if (index < otpInputs.length - 1) {
          otpInputs[index + 1].focus()
        }
      } else {
        e.target.classList.remove('filled')
      }

      updateVerifyButton()
    })

    // Handle keydown
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !e.target.value && index > 0) {
        otpInputs[index - 1].focus()
        otpInputs[index - 1].value = ''
        otpInputs[index - 1].classList.remove('filled')
        updateVerifyButton()
      }

      if (e.key === 'Enter') {
        handleVerifyOTP()
      }
    })

    // Handle paste
    input.addEventListener('paste', (e) => {
      e.preventDefault()
      const pastedData = e.clipboardData.getData('text').replace(/[^0-9]/g, '')

      if (pastedData.length >= 4) {
        for (let i = 0; i < 4 && i < pastedData.length; i++) {
          otpInputs[i].value = pastedData[i]
          otpInputs[i].classList.add('filled')
        }
        otpInputs[3].focus()
        updateVerifyButton()
      }
    })

    // Handle focus
    input.addEventListener('focus', () => {
      input.select()
    })
  })

  function updateVerifyButton() {
    const code = Array.from(otpInputs).map(input => input.value).join('')
    const verifyBtn = document.getElementById('verifyOtpBtn')
    verifyBtn.disabled = code.length !== 4 || isVerifyingOTP

    // Auto-submit as soon as all 4 digits are entered
    if (code.length === 4 && !isVerifyingOTP) {
      handleVerifyOTP()
    }
  }

  // ============================================
  // Phone Input Formatting
  // ============================================

  const phoneInput = document.getElementById('phoneNumber')

  phoneInput.addEventListener('input', (e) => {
    let value = e.target.value.replace(/[^0-9]/g, '')
    if (value.length > 11) value = value.slice(0, 11)
    e.target.value = value
  })

  phoneInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      handleSendOTP()
    }
  })

</script>

</body>
</html>
